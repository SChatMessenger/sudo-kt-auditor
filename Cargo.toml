[package]
name = "sudo-kt-auditor"
description = "Independent key transparency auditor for Sudo: checks every epoch of a relay's public audit proofs (sudoproto.md §6.4, §10.14)."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-only"

[dependencies]
# Head parsing and signature checks: our own released SDK (repo CLAUDE.md).
sudo-kt = { version = "=0.7.0", git = "https://github.com/SChatMessenger/sudo-sdk.git", tag = "v0.7.0" }
# The append-only proof check is akd's own (Q57, owner approved; exact pin, the
# version sudo-relay and sudo-protocol use).
akd = { version = "=0.13.0", default-features = false, features = ["experimental", "public_auditing"] }
# akd's proof encoding (§10.14); the version akd uses.
protobuf = "=3.7.2"
# akd's checks are async; also the plain HTTP client (no TLS yet, like sudo-cli).
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }

# Test-only: a real relay (released tag, development build), its database, a
# fake dishonest relay (axum), the test vectors (serde_json), test keys.
[dev-dependencies]
sudo-relay = { version = "=0.5.0", git = "https://github.com/SChatMessenger/sudo-relay.git", tag = "v0.5.0", features = ["dev-stubs"] }
sudo-crypto = { version = "=0.7.0", git = "https://github.com/SChatMessenger/sudo-sdk.git", tag = "v0.7.0" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
