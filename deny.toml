[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# BSD-3-Clause: ed25519-dalek, curve25519-dalek, subtle (via sudo-crypto and
# akd; the same crates and license the SDK and relay allow).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Only these exact old versions are excused (checked with `cargo tree -i`);
# any other duplicate still fails.
skip = [
  # sha2 0.10 and its helpers: inside sqlx-core (test database only) and
  # curve25519-dalek 4 (akd).
  { crate = "block-buffer@0.10.4", reason = "sha2 0.10: inside sqlx-core and akd" },
  { crate = "cpufeatures@0.2.17", reason = "sha2 0.10: inside sqlx-core and akd" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10: inside sqlx-core and akd" },
  { crate = "digest@0.10.7", reason = "inside sqlx-core and akd" },
  { crate = "sha2@0.10.9", reason = "inside sqlx-core (tests only)" },
  { crate = "syn@2.0.119", reason = "build-time only: sqlx-macros uses syn 2, the url stack uses syn 3" },
  # Key transparency (sudoproto.md §4, §6, Q57, owner approved 2026-11-13): akd 0.13.0 needs
  # ed25519-dalek 2 / curve25519-dalek 4 and some helpers in other versions than sudo-crypto.
  { crate = "curve25519-dalek@4.1.3", reason = "Q57: only inside akd" },
  { crate = "ed25519@2.2.3", reason = "Q57: only inside akd" },
  { crate = "ed25519-dalek@2.2.0", reason = "Q57: only inside akd" },
  { crate = "fiat-crypto@0.2.9", reason = "Q57: only inside akd" },
  { crate = "hashbrown@0.14.5", reason = "Q57: only inside akd" },
  { crate = "linux-raw-sys@0.4.15", reason = "Q57: only inside akd" },
  { crate = "rustix@0.38.44", reason = "Q57: only inside akd" },
  { crate = "signature@2.2.0", reason = "Q57: only inside akd" },
  { crate = "windows-sys@0.59.0", reason = "Q57: only inside akd" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Our own SDK and (tests only) relay, released tags only (repo CLAUDE.md).
allow-git = ["https://github.com/SChatMessenger/sudo-sdk.git", "https://github.com/SChatMessenger/sudo-relay.git"]
